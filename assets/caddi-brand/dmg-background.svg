<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1d"/>
      <stop offset="0.55" stop-color="#101011"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0" r="0.9" gradientTransform="translate(0.5 0) scale(1 0.62) translate(-0.5 0)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#e3e3e6"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a0a0b" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="660" height="420" fill="url(#plate)"/>
  <rect width="660" height="420" fill="url(#shine)"/>
  <rect x="0.5" y="0.5" width="659" height="419" fill="none" stroke="url(#rim)"/>
  <!-- Finder draws icon names in black over a picture, so the icons sit on a light tray. -->
  <rect x="60" y="60" width="540" height="232" rx="28" fill="url(#tray)" filter="url(#lift)"/>
  <rect x="60.5" y="60.5" width="539" height="231" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.9"/>
  <g fill="none" stroke="url(#arrow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M287 164h86"/>
    <path d="M363 153l11 11-11 11"/>
  </g>
  <text x="330" y="342" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="-0.1" fill="#f4f4f5">Drag Caddi to Applications</text>
  <text x="330" y="366" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.1" fill="#8e8e93">Open source · MIT licensed</text>
</svg>
