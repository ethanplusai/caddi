name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Caddi is a Mac app: agent connections use Unix sockets and several tests start Electron.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
